name: SteelControl Quality Gate

on:
  push:
    branches: ["main", "master"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: steelcontrol-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Static + Unit + Security
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: face-api/requirements-production.txt

      - name: Install backend dependencies
        run: npm ci --prefix backend --no-audit --no-fund

      - name: Prisma validate
        working-directory: backend
        env:
          DATABASE_URL: postgresql://postgres:placeholder@localhost:5432/steelcontrol?schema=public
        run: npx prisma validate

      - name: SteelControl quality gates
        run: npm run quality

      - name: Install minimal Face API test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy==2.2.6 opencv-python-headless==4.12.0.88

      - name: Face API syntax
        run: |
          python -m py_compile \
            face-api/app/main.py \
            face-api/app/face_rules.py \
            face-api/app/image_utils.py \
            face-api/verificar_ambiente.py

      - name: Face API unit tests
        working-directory: face-api
        env:
          PYTHONPATH: .
        run: python -m unittest discover -s tests -p "test_*.py" -v

  e2e:
    name: PostgreSQL E2E
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: steelcontrol
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d steelcontrol"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    env:
      NODE_ENV: development
      PORT: 3000
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/steelcontrol?schema=public
      JWT_SECRET: ci-steelcontrol-jwt-secret-2026-with-more-than-32-characters
      JWT_EXPIRES_IN: 1h
      FACE_API_URL: http://127.0.0.1:8000
      FACE_API_KEY: ci-face-api-key-with-more-than-32-characters
      CORS_ORIGINS: ""
      DEVICE_COMMAND_LEASE_MS: 5000
      E2E_API_URL: http://127.0.0.1:3000
      E2E_EMAIL: admin@steelcontrol.com
      E2E_PASSWORD: Steel123!

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        run: npm ci --prefix backend --no-audit --no-fund

      - name: Generate Prisma Client
        working-directory: backend
        run: npx prisma generate

      - name: Apply migrations
        working-directory: backend
        run: npx prisma migrate deploy

      - name: Seed E2E user
        working-directory: backend
        run: npm run seed

      - name: Start backend
        run: |
          npm --prefix backend start > backend-e2e.log 2>&1 &
          echo $! > backend.pid

      - name: Wait for healthcheck
        shell: bash
        run: |
          for i in {1..40}; do
            if curl -fsS http://127.0.0.1:3000/api/health >/dev/null; then
              echo "Backend ready."
              exit 0
            fi
            sleep 1
          done
          echo "Backend did not become healthy."
          cat backend-e2e.log || true
          exit 1

      - name: Run full E2E
        working-directory: backend
        run: npm run test:e2e

      - name: Upload E2E backend log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: steelcontrol-e2e-log
          path: backend-e2e.log
          if-no-files-found: ignore
          retention-days: 14
