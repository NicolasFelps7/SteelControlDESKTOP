name: Security Scan

on:
  push:
    branches: ["main", "master"]
  pull_request:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:
    inputs:
      target_url:
        description: "URL HTTPS autorizada de homologação para OWASP ZAP"
        required: false
        type: string

permissions:
  contents: read

jobs:
  dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci --prefix backend --ignore-scripts
      - run: npm audit --prefix backend --audit-level=high
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install pip-audit
      - run: pip-audit -r face-api/requirements-production.txt

  zap:
    if: github.event_name == 'workflow_dispatch' && inputs.target_url != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: OWASP ZAP baseline (homologação autorizada)
        uses: zaproxy/action-baseline@v0.15.0
        with:
          target: ${{ inputs.target_url }}
          fail_action: true
          allow_issue_writing: false
